name: Build PR-Agent image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: takotakot/pr-agent のブランチまたはコミット
        required: true
        default: feature/add-support-for-gemini-4-argon
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/takotakot/pr-agent-action-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          repository: takotakot/pr-agent
          ref: ${{ inputs.ref }}
      - id: src
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: github_action
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.src.outputs.sha }}
      - name: Check the image and record its digest
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          docker run --rm --entrypoint python "$REF" -c \
            "import importlib.metadata as m; from pr_agent.algo import MAX_TOKENS; \
             print('litellm', m.version('litellm')); print('argon', MAX_TOKENS.get('gemini/gemini-4-argon'))" \
            | tee check.txt
          {
            echo '```'
            echo "uses: docker://$REF"
            cat check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
